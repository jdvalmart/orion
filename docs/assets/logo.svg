<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Constellation Orion -->
  <g transform="translate(10,10)">
    <!-- Stars -->
    <circle cx="50" cy="10" r="4" fill="#6366f1"/>
    <circle cx="25" cy="30" r="3" fill="#818cf8"/>
    <circle cx="75" cy="30" r="3" fill="#818cf8"/>
    <circle cx="15" cy="55" r="3.5" fill="#a5b4fc"/>
    <circle cx="50" cy="50" r="5" fill="#6366f1"/>
    <circle cx="85" cy="55" r="3.5" fill="#a5b4fc"/>
    <circle cx="35" cy="75" r="3" fill="#c7d2fe"/>
    <circle cx="65" cy="75" r="3" fill="#c7d2fe"/>
    <circle cx="50" cy="95" r="4" fill="#6366f1"/>
    <!-- Lines connecting stars -->
    <line x1="50" y1="10" x2="25" y2="30" stroke="#6366f180" stroke-width="1.5"/>
    <line x1="50" y1="10" x2="75" y2="30" stroke="#6366f180" stroke-width="1.5"/>
    <line x1="25" y1="30" x2="15" y2="55" stroke="#818cf880" stroke-width="1"/>
    <line x1="75" y1="30" x2="85" y2="55" stroke="#818cf880" stroke-width="1"/>
    <line x1="15" y1="55" x2="50" y2="50" stroke="#a5b4fc80" stroke-width="1.5"/>
    <line x1="85" y1="55" x2="50" y2="50" stroke="#a5b4fc80" stroke-width="1.5"/>
    <line x1="50" y1="50" x2="35" y2="75" stroke="#a5b4fc80" stroke-width="1.5"/>
    <line x1="50" y1="50" x2="65" y2="75" stroke="#a5b4fc80" stroke-width="1.5"/>
    <line x1="35" y1="75" x2="50" y2="95" stroke="#c7d2fe80" stroke-width="1"/>
    <line x1="65" y1="75" x2="50" y2="95" stroke="#c7d2fe80" stroke-width="1"/>
  </g>
</svg>
