[project]
name = "orion"
version = "5.0.0"
description = "MCP server providing persistent, per-project memory for AI coding assistants."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4,<5",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
semantic = [
    "sqlite-vec>=0.1.6,<0.2",
    "fastembed>=0.5,<1",
]
s3 = [
    "boto3>=1.35,<2",
]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
orion = "orion.server:main"
orion-backup = "orion.backup_local:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "data.bak-*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "BLE", # blind except
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["orion"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
