services:
  orion:
    build: .
    container_name: orion-mcp
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - orion_data:/data
    environment:
      - ORION_TOKEN=${ORION_TOKEN:?set ORION_TOKEN in .env}
      - ORION_S3_BUCKET=${ORION_S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    restart: unless-stopped

volumes:
  orion_data:
